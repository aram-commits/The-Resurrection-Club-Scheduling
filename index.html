<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Resurrection Club – Production Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet"><style id="css">
/* =====================================================================
   BRAND TOKENS – swap these for The Network's official values.
   (Inferred from the public brand: dark premium streaming UI, retro
   broadcast "on-air" accent. Replace with the real hex codes / fonts.)
   ===================================================================== */
:root{
  --brand-accent:#F5B700;        /* on-air amber */
  --brand-accent-ink:#1A1300;
  --font-display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --font-body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  /* dark theme (default look of the brand) */
  --bg:#141519; --bg-2:#1C1D23; --card:#23252D; --card-hi:#2C2F39; --line:#363945;
  --ink:#F3EFE7; --mute:#A3A7B3; --dim:#6E7380;
  --ok:#3DD598; --ok-soft:rgba(61,213,152,.14);
  --bad:#FF4D5E; --bad-soft:rgba(255,77,94,.16);
  --warn:#FFB547; --warn-soft:rgba(255,181,71,.14);
  --night:#2A3550;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F4F2EE; --bg-2:#ECE9E3; --card:#FFFFFF; --card-hi:#F7F5F1; --line:#DDD8CF;
    --ink:#17181C; --mute:#5E6270; --dim:#8D909A; --night:#DCE3F2;
    --ok:#138A5E; --ok-soft:rgba(19,138,94,.12); --bad:#D3263A; --bad-soft:rgba(211,38,58,.12); --warn:#B26A00; --warn-soft:rgba(178,106,0,.12);
    --brand-accent:#E0A600;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F4F2EE; --bg-2:#ECE9E3; --card:#FFFFFF; --card-hi:#F7F5F1; --line:#DDD8CF;
  --ink:#17181C; --mute:#5E6270; --dim:#8D909A; --night:#DCE3F2;
  --ok:#138A5E; --ok-soft:rgba(19,138,94,.12); --bad:#D3263A; --bad-soft:rgba(211,38,58,.12); --warn:#B26A00; --warn-soft:rgba(178,106,0,.12);
  --brand-accent:#E0A600; color-scheme:light;
}
:root[data-theme="dark"]{color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand-accent);outline-offset:2px}
a{color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- nav ---------- */
nav{display:flex;align-items:center;gap:20px;padding:12px 28px;flex:none;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:800 20px/1 var(--font-display);letter-spacing:.02em;white-space:nowrap}
.onair{width:10px;height:10px;border-radius:50%;background:var(--brand-accent);box-shadow:0 0 0 4px rgba(245,183,0,.18)}
.tabs{display:flex;gap:4px;margin-left:12px}
.tabs button{border:0;background:none;padding:7px 12px;border-radius:999px;color:var(--mute);cursor:pointer;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs .count[hidden]{display:none}
.tabs .count{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;font-weight:700;text-align:center}
.navr{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:14px;white-space:nowrap}
.pill:hover{border-color:var(--mute)}.pill:disabled{opacity:.4;cursor:default}
.pill.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.plan{display:inline-flex;background:var(--bg-2);border-radius:999px;padding:3px;border:1px solid var(--line)}
.plan button,.tabs button{white-space:nowrap}
.plan button{border:0;background:none;padding:5px 12px;border-radius:999px;cursor:pointer;font-size:14px;color:var(--mute)}
.plan button[aria-pressed="true"]{background:var(--brand-accent);color:var(--brand-accent-ink);font-weight:700}

/* ---------- layout ---------- */
.shell{flex:1;min-height:0;display:flex}
#scroller{flex:1;min-width:0;overflow:auto;overscroll-behavior:contain}
.page{padding:26px 28px 80px;max-width:1240px}
.view{display:none}.view.on{display:block}
body:not(.t-home) .hero{display:none}
body.sbmode .hero{display:none}
body.sbmode .page{max-width:none}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:22px;align-items:stretch;margin-bottom:30px}
.show{padding:6px 0}
.kicker{color:var(--brand-accent);font-weight:700;font-size:14px;margin:0 0 6px}
.show h1{font:800 clamp(40px,6vw,72px)/.92 var(--font-display);margin:0;letter-spacing:.005em;text-transform:uppercase}
.show p{color:var(--mute);margin:10px 0 0;max-width:56ch}
.facts{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:18px}
.fact b{display:block;font:800 30px/1 var(--font-display);color:var(--ink)}
.fact span{color:var(--mute);font-size:13.5px}
.status{border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;justify-content:center;gap:8px;background:var(--card);border:1px solid var(--line)}
.status.ok{background:linear-gradient(var(--ok-soft),var(--ok-soft)),var(--card);border-color:var(--ok)}
.status.bad{background:linear-gradient(var(--bad-soft),var(--bad-soft)),var(--card);border-color:var(--bad)}
.status h2{font:800 34px/1 var(--font-display);margin:0;text-transform:uppercase}
.status.ok h2{color:var(--ok)}.status.bad h2{color:var(--bad)}
.status p{margin:0;color:var(--mute)}
.cta{align-self:flex-start;border:0;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:700;cursor:pointer;margin-top:4px}
.cta.accent{background:var(--brand-accent);color:var(--brand-accent-ink)}

/* ---------- week shelves ---------- */
.week{margin:0 0 26px}
.week h3{font:800 22px/1.1 var(--font-display);text-transform:uppercase;margin:0 0 10px;display:flex;align-items:baseline;gap:12px}
.week h3 small{font:500 14px var(--font-body);color:var(--mute);text-transform:none}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px}
.dc{position:relative;border-radius:12px;background:var(--card);border:1px solid var(--line);padding:12px 13px 12px;cursor:pointer;min-height:150px;display:flex;flex-direction:column;gap:6px;transition:transform .12s,border-color .12s}
.dc:hover{transform:translateY(-2px);border-color:var(--mute)}
.dc.sel{border-color:var(--brand-accent);box-shadow:0 0 0 2px var(--brand-accent)}
.dc.night{background:linear-gradient(160deg,var(--night),var(--card) 70%)}
.dc .top{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.dc .top b{color:var(--ink);font-weight:700}
.dc .ico{margin-left:auto;font-size:15px}
.dc h4{font:800 21px/1.02 var(--font-display);margin:2px 0 0;text-transform:uppercase;letter-spacing:.005em}
.dc .sub{font-size:13px;color:var(--mute)}
.bar{height:6px;border-radius:3px;background:var(--bg-2);overflow:hidden;display:flex;margin-top:auto}
.bar i{background:var(--ink);opacity:.75}.bar u{background:repeating-linear-gradient(45deg,var(--brand-accent) 0 4px,transparent 4px 7px)}
.bar.heavy i{background:var(--warn);opacity:1}
.tagrow{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px}
.t-ok{background:var(--ok-soft);color:var(--ok)}.t-bad{background:var(--bad);color:#fff}.t-warn{background:var(--warn-soft);color:var(--warn)}.t-sat{background:var(--brand-accent);color:var(--brand-accent-ink)}.t-mute{background:var(--bg-2);color:var(--mute)}
.dc.hlday{border-color:var(--brand-accent)}
.dc.outday{opacity:.45}
/* drag states */
body.dragging{cursor:grabbing;user-select:none}
.dc.d-ok{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.dc.d-warn{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn)}
.dc.d-bad{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad);background:repeating-linear-gradient(135deg,var(--bad-soft) 0 9px,transparent 9px 18px),var(--card)}
.dc .no{display:none}
.dc.d-bad .no{display:block;position:absolute;inset:auto 8px 8px 8px;background:var(--bad);color:#fff;font-size:12.5px;font-weight:700;line-height:1.3;padding:6px 8px;border-radius:8px}
.dc.over{transform:scale(1.03)}
.dc.d-bad.over{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.ghost{position:fixed;z-index:999;pointer-events:none;padding:8px 12px;border-radius:10px;background:var(--brand-accent);color:var(--brand-accent-ink);font-weight:700;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.4);max-width:260px}

/* ---------- drawer ---------- */
aside{width:400px;flex:none;border-left:1px solid var(--line);background:var(--bg-2);overflow:auto;padding:22px 22px 60px;display:none}
aside.open{display:block}
aside h2{font:800 30px/1 var(--font-display);text-transform:uppercase;margin:4px 0 4px}
aside .when{color:var(--brand-accent);font-weight:700;margin:0}
aside p{margin:6px 0;color:var(--mute)}
.x{float:right;border:0;background:var(--card);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px;border:1px solid var(--line);margin:12px 0 4px}
.seg button{flex:1;border:0;background:none;padding:7px 4px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.scene{display:grid;grid-template-columns:22px 1fr auto;gap:2px 10px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 10px 10px 8px;margin:8px 0}
.scene.bad{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.scene.warn{box-shadow:inset 3px 0 0 var(--warn)}
.grip{cursor:grab;color:var(--dim);font-size:16px;line-height:1.2;user-select:none;touch-action:none;padding-top:1px}
.scene .t{font-weight:700}
.scene .m{font-size:13px;color:var(--mute)}
.scene .who{font-size:13px;margin-top:2px}
.scene .who .out{color:var(--bad);font-weight:700}
.scene .why{grid-column:2/4;font-size:13px;color:var(--bad);font-weight:600}
.scene .wwhy{grid-column:2/4;font-size:13px;color:var(--warn)}
.mv{border:1px solid var(--line);background:var(--bg-2);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
.mv:hover{border-color:var(--brand-accent)}
.saved{display:flex;align-items:center;gap:10px;background:var(--card);border:1px dashed var(--brand-accent);border-radius:10px;padding:10px 12px;margin:10px 0}
.saved .s{flex:1;font-size:14px}
.step{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--bg-2);cursor:pointer;font-size:16px}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px;margin-top:8px}
.picker button{border:1px solid var(--line);background:var(--ok-soft);border-radius:8px;padding:6px 2px;font-size:12.5px;line-height:1.25;cursor:pointer;color:var(--ink)}
.picker button b{display:block;font-size:13.5px}
.picker button.p-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.picker button.p-warn{background:var(--warn-soft)}
.picker button.p-best{outline:2px solid var(--brand-accent)}
.picker button.p-cur{opacity:.5;cursor:default}
.note{font-size:13px;color:var(--mute)}

/* ---------- lists ---------- */
.fix{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:12px;padding:14px 16px;margin:10px 0}
.fix.warn{border-left-color:var(--warn)}
.fix .b{flex:1}.fix .b b{display:block;margin-bottom:2px}
.fix .b span{color:var(--mute);font-size:14px}
.fix .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;text-align:left}
.empty h3{font:800 26px var(--font-display);text-transform:uppercase;margin:0 0 4px;color:var(--ok)}
.person{display:grid;grid-template-columns:46px 220px 1fr;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer}
.person:hover{border-color:var(--mute)}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:800 18px var(--font-display);background:var(--bg-2);border:2px solid var(--line)}
.person.rule .av{border-color:var(--brand-accent)}
.person .n{font-weight:700}.person .d{font-size:13px;color:var(--mute)}
.dots{display:flex;flex-wrap:wrap;gap:3px}
.dots i{width:14px;height:14px;border-radius:4px;background:var(--bg-2);display:inline-block}
.dots i.w{background:var(--ink)}.dots i.x{background:repeating-linear-gradient(135deg,var(--bad) 0 2px,transparent 2px 5px);opacity:.7}
.dots i.wx{background:var(--bad)}.dots i.gap{margin-left:7px}
.place{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:8px 0;display:grid;grid-template-columns:240px 1fr;gap:12px;align-items:center}
.place .n{font:800 20px var(--font-display);text-transform:uppercase}
.place .d{font-size:13px;color:var(--mute)}
.chip{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--bg-2);margin:2px 3px 2px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--mute);font-size:13px;margin:4px 0 12px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
h2.sec{font:800 30px var(--font-display);text-transform:uppercase;margin:0 0 4px}
p.lede{color:var(--mute);margin:0 0 14px;max-width:70ch}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:1000;max-width:92vw}
#toast.on{opacity:1}#toast.err{background:var(--bad);color:#fff}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--bg-2);color:var(--ink);max-width:min(620px,94vw);width:100%;padding:20px}
dialog::backdrop{background:rgba(0,0,0,.6)}
textarea{width:100%;height:240px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:12px/1.4 ui-monospace,Menlo,monospace;padding:8px}


/* ---------- hub / live ---------- */
.livebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:9px 28px;border-bottom:1px solid var(--line);background:var(--bg-2);font-size:13.5px;color:var(--mute)}
.livebar b{color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--dim)}
.dot.live{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}.dot.sand{background:var(--brand-accent)}
.modetog{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px}
.modetog button{border:0;background:none;padding:4px 12px;border-radius:999px;cursor:pointer;color:var(--mute);font-size:13px;white-space:nowrap}
.modetog button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.rolechip{padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.rolechip.edit{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.rolechip.ro{background:var(--bg-2)}
.sandbanner{display:none;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 16px;padding:12px 16px;border:1px dashed var(--brand-accent);border-radius:12px;background:rgba(245,183,0,.08)}
body.sandbox .sandbanner{display:flex}
.sandbanner p{margin:0;flex:1;min-width:240px}
body.ro .grip,body.ro .mv,body.ro .step,body.ro [data-fix],body.ro [data-later]{display:none!important}
body.ro .seg button{pointer-events:none}
body.ro .st{cursor:default}
.hubgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:6px 0 26px}
.tile{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:16px;cursor:pointer;min-height:118px;text-decoration:none;color:var(--ink)}
.tile:hover{border-color:var(--brand-accent)}
.tile b{font:800 24px/1 var(--font-display);text-transform:uppercase}
.tile span{color:var(--mute);font-size:14px}
.tile .big{font:800 34px/1 var(--font-display);margin-top:auto}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:18px}
.panel h3{font:800 22px/1.1 var(--font-display);text-transform:uppercase;margin:0 0 10px}
.cmp{width:100%;border-collapse:collapse;font-size:14px}
.cmp th,.cmp td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.cmp th{color:var(--mute);font-weight:500}
.cmp td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.cmp .off{display:inline-block;margin-left:6px;padding:0 7px;border-radius:999px;background:var(--brand-accent);color:var(--brand-accent-ink);font-size:11.5px;font-weight:800}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.feed li:last-child{border-bottom:0}
.feed img{width:26px;height:26px;border-radius:50%;flex:none}
.feed .w{color:var(--mute);font-size:12.5px}
.kd{list-style:none;margin:0;padding:0;font-size:14px}
.kd li{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.kd li:last-child{border-bottom:0}
.kd b{font-weight:700}
@media (max-width:980px){.hubgrid{grid-template-columns:1fr}.livebar{padding:8px 16px}}

/* ---------- stripboard view ---------- */
.schedbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:0 0 16px}
.viewtog{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.viewtog button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--mute);font-weight:500;white-space:nowrap}
.viewtog button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.skey{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--mute)}
.skey span{display:inline-flex;align-items:center;gap:5px}
.skey i{width:22px;height:12px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.25)}
:root{--s-id:#F4F1EA;--s-ed:#FFE27A;--s-in:#A9C6EA;--s-en:#A8D5A0;--s-dusk:#F6B98E;--s-dawn:#E9B9E3;--s-ink:#15161A}
.sbwrap{overflow:auto;height:max(440px,calc(100dvh - 190px));border:1px solid var(--line);border-radius:14px;background:var(--bg-2);overscroll-behavior:contain}
.sb{display:flex;gap:8px;padding:10px;width:max-content;align-items:flex-start;min-height:100%}
.scol{width:212px;flex:none;border-radius:10px;background:var(--card);border:1px solid var(--line);position:relative}
.shead{position:sticky;top:0;z-index:3;background:#0B0C0F;color:#F3EFE7;border-radius:9px 9px 0 0;padding:8px 10px 9px;cursor:pointer;border-bottom:3px solid var(--brand-accent)}
.shead.night{border-bottom-color:#6E86C9}.shead.split{border-bottom-color:#F6B98E}
.shead .r{display:flex;align-items:baseline;gap:7px}
.shead .n{font:800 19px/1 var(--font-display);text-transform:uppercase}
.shead .dt{font-size:12.5px;color:#B8BCC6}
.shead .ic{margin-left:auto;font-size:14px}

.st .d{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.st.bad{outline:2.5px solid var(--bad);outline-offset:-1px}
.st.bad .a::after{content:"!";background:var(--bad);color:#fff;border-radius:50%;width:15px;height:15px;font:800 11px/15px var(--font-body);text-align:center;flex:none}
.st.warn{outline:2px dashed var(--warn);outline-offset:-1px}

.sb.hl .st:not(.focus){opacity:.35}
.st.src{opacity:.25}
.shold{border-radius:4px;padding:5px 9px;font-size:12px;font-style:italic;color:var(--mute);border:1px dashed var(--brand-accent);background:repeating-linear-gradient(45deg,rgba(245,183,0,.10) 0 6px,transparent 6px 12px);cursor:pointer}

.scol.d-bad{outline:2px solid var(--bad);outline-offset:-1px}

.sno{position:sticky;top:100px;z-index:2;margin:6px 6px 0;padding:6px 8px;border-radius:8px;background:var(--bad);color:#fff;font-size:12.5px;font-weight:700;line-height:1.3}

/* ---------- rules ---------- */
function ruleOut(c,date){const r=RULES[c];if(!r)return false;if(r.windows)return !r.windows.some(([a,b])=>date>=a&&date<=b);
  return (r.from&&date<r.from)||(r.to&&date>r.to)||(r.off&&r.off.includes(date))||false}
function outWhy(c,date){
  if(c==='5'){if(date<RULES['5'].from)return "Sally can't start until Oct 28";if(RULES['5'].off.includes(date))return 'Sally is off Nov 4';return 'Sally has wrapped (he finishes before Thanksgiving)'}
  if(c==='9')return "Frank isn't available until Nov 10";if(c==='12')return "Vincent isn't in town that day";return `${nm(c)} isn't available`}
function check(id,day){const s=SC[id],hard=[],soft=[];if(!s||!day)return{hard,soft};
  s.cast.forEach(c=>{if(ruleOut(c,day.date))hard.push({c,t:outWhy(c,day.date)})});
  if(s.ie==='E'&&s.dn==='D'&&day.type==='NIGHT')hard.push({t:'It\'s an outdoor daytime scene and this is a night shoot'});
  if(s.ie==='E'&&s.dn==='N'&&day.type==='DAY')soft.push({t:'Outdoor night scene on a day shoot. Do it after dark at the end of the day.'});
  return{hard,soft}}
const tm=s=>{const[h,m]=s.split(':').map(Number);return h*60+m};
function rest(b,i){if(i===0)return null;const p=b.days[i-1],d=b.days[i];let w=dP(p.date).getTime()+tm(p.wrap)*6e4;if(tm(p.wrap)<=tm(p.call))w+=864e5;return Math.round((dP(d.date).getTime()+tm(d.call)*6e4-w)/36e5*10)/10}
function dayInfo(i,b=B()){const d=b.days[i];let p=0,bad=0,warn=0;const loc={},cast=new Set(),eps=new Set();
  d.items.forEach(id=>{const s=SC[id];if(!s)return;p+=s.p;eps.add(s.ep);s.cast.forEach(c=>cast.add(c));loc[s.loc]=(loc[s.loc]||0)+s.p;const k=check(id,d);if(k.hard.length)bad++;else if(k.soft.length)warn++});
  const top=Object.entries(loc).sort((a,b2)=>b2[1]-a[1]).map(x=>x[0]);const sites=new Set(top.map(l=>l in SITE?SITE[l]:l).filter(Boolean));const r=rest(b,i);
  return{p,h:d.hold||0,tot:p+(d.hold||0),bad,warn,top,cast,eps:[...eps].sort(),moves:Math.max(0,sites.size-1),rest:r,restBad:r!==null&&r<12}}
function problems(b=B()){const out=[];
  b.days.forEach((d,i)=>{d.items.forEach(id=>{const k=check(id,d);if(k.hard.length)out.push({kind:'scene',id,day:i,t:k.hard.map(x=>x.t).join('; ')})});
    const f=dayInfo(i,b);if(f.restBad)out.push({kind:'rest',day:i,t:`Day ${i+1} starts only ${f.rest} hours after the day before wrapped. The crew needs 12.`});
    if(f.moves>1)out.push({kind:'moves',day:i,warn:true,t:`Day ${i+1} has ${f.moves} company moves (${f.top.map(nice).join(', ')}). That's a lot for one day.`});
    if(f.tot>112)out.push({kind:'heavy',day:i,warn:true,t:`Day ${i+1} is very full: ${pgw(f.tot)} including saved space. About 12 is the target.`})});
  return out}
function bestDay(id){const s=SC[id],b=B(),cur=b.days.findIndex(d=>d.items.includes(id));let best=null,score=-1e9;const site=l=>l in SITE?SITE[l]:l;
  b.days.forEach((d,i)=>{if(i===cur)return;const k=check(id,d);if(k.hard.length)return;const f=dayInfo(i);let sc=0;const locs=d.items.map(x=>SC[x]&&SC[x].loc);
    if(locs.includes(s.loc))sc+=100;else if(locs.some(l=>site(l)===site(s.loc)))sc+=60;sc-=Math.max(0,f.tot+s.p-TARGET)*1.5;sc-=k.soft.length*20;if(cur>=0)sc-=Math.abs(i-cur)*.5;if(sc>score){score=sc;best=i}});return best}
function summary(o){const b=o===local.opt?B():(sandbox()?(local.sand[o]||live[o]):live[o]);let p=0,h=0,sh=0;
  b.days.forEach((d,i)=>{const f=dayInfo(i,b);p+=f.p;h+=f.h;if(!ruleOut('5',d.date))sh+=f.h});
  return{days:b.days.length,sat:b.days.filter(d=>dP(d.date).getDay()===6).length,p,h,sh,probs:problems(b).filter(x=>!x.warn).length,b}}

/* ---------- actions ---------- */
function moveScene(id,to,idx){if(!guard())return false;const b=B(),from=b.days.findIndex(d=>d.items.includes(id));const k=check(id,b.days[to]);
  if(k.hard.length){toast(`Can't move it there: ${k.hard[0].t}`,true);return false}
  commit();const arr=b.days[from].items,oi=arr.indexOf(id);arr.splice(oi,1);const tl=b.days[to].items;tl.splice(idx==null?tl.length:Math.min(idx,tl.length),0,id);
  const msg=from===to?`Reordered scene ${id} on ${dT(b.days[to].date)}`:`Moved scene ${id} from ${dT(b.days[from].date)} to ${dT(b.days[to].date)}`;
  persist(`${msg} (Plan ${local.opt})`);toast(from===to?`Scene ${id} reordered`:`Scene ${id} moved to ${dS(b.days[to].date)}`);return true}

function setupStandalone(){STANDALONE=true;document.body.classList.add('standalone');
  const mt=$('.modetog [data-mode="live"]');if(mt)mt.textContent='Official schedule';
  const lock=document.createElement('button');lock.className='pill';lock.id='lockBtn';$('#roleChip').after(lock);
  lock.onclick=()=>{if(canWrite){canWrite=false;applyRole();render();toast('Editing locked');return}
    pinDialog('Unlock editing','Enter the editor PIN.',v=>{if(h32('rc-salt:'+v)!==PINHASH){toast('That PIN isn\'t right.',true);return}
      canWrite=true;local.mode='live';
      try{const dr=JSON.parse(localStorage.getItem(DKEY)||'null');if(dr&&dr.base===BASE){live.A=dr.boards.A;live.B=dr.boards.B;live.official=dr.official;if(dr.pinHash)PINHASH=dr.pinHash;dirty=true;setTimeout(()=>toast('Restored your changes that haven\'t been uploaded yet'),200)}}catch(e){}
      saveLocal();applyRole();render();if(!dirty)toast('Editing unlocked')})};
  document.addEventListener('click',e=>{if(e.target.closest('#dlPage,#dlPage2'))downloadPage();if(e.target.closest('#pinChange'))pinDialog('Change editor PIN','Enter a new PIN (at least 4 characters). It takes effect for everyone once you upload the updated page.',v=>{if(v.length<4){toast('Use at least 4 characters.',true);return}PINHASH=h32('rc-salt:'+v);saveDraft();toast('PIN changed. Download and upload the updated page to apply it.')})});
  applyRole();render()}
/* ---------- connect ---------- */
async function standalone(){const html=buildHTML();const fn='Resurrection_Club_Schedule.html';
  const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
  if(dl){try{const r=await dl.save({filename:fn,data:new Blob([html],{type:'text/html'})});if(r&&r.status==='saved')toast('Downloaded. Email it or host it anywhere; it opens in any browser.')}catch(e){if(!(e&&e.code==='cancelled'))toast('Download didn\'t work. Try again.',true)}return}
  toast('Downloads aren\'t available in this view.',true)}
document.addEventListener('click',e=>{if(e.target.closest('#standalone'))standalone()});
async function connect(){
  if(!window.claude||!window.claude.use){setupStandalone();return}
  const [a,u]=await Promise.all([window.claude.use('artifact'),window.claude.use('user')]);user=u;
  if(u){try{me=await u.me()}catch(e){}}
  if(a&&u){try{canWrite=!!(await u.canEdit())}catch(e){}}
  art=a;connected=!!a;applyRole();render();
  const lb=live[local.opt];if(lb.updatedBy&&lb.updatedBy!==me.id&&(local.seen||0)<lb.updatedAt){resolveNames([lb.updatedBy]).then(()=>toast(`Updated ${ago(lb.updatedAt)} by ${names[lb.updatedBy]?.name||'an editor'}`))}
  local.seen=Math.max(live.A.updatedAt||0,live.B.updatedAt||0);saveLocal();
}
window.addEventListener('pagehide',()=>{if(pubTimer&&!publishing){clearTimeout(pubTimer);doPublish()}});
setLook(ui.look||local.look||'cards',true);tab=null;setTab(ui.tab||'home',true);applyRole();
if(ui.scroll)requestAnimationFrame(()=>{$('#scroller').scrollTop=ui.scroll;const w=$('#sbwrap');if(w&&ui.sx)w.scrollLeft=ui.sx});
if(ui.conflict)setTimeout(()=>toast('Another editor published at the same moment, so your last change wasn\'t kept. Please redo it.',true),300);
else if(ui.saved&&Date.now()-ui.saved<20000)setTimeout(()=>toast('Published for everyone'),300);
try{sessionStorage.setItem(SKEY,'{}')}catch(e){}
connect();
})();
</script></body></html>
